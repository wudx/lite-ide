[package]
name = "lite-ide"
version = "0.1.0"
description = "Lightweight, high-performance, micro-kernel cross-platform IDE"
authors = ["LiteIDE"]
edition = "2021"

[lib]
name = "lite_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"] }
dashmap = "6"
ignore = "0.4"
notify = "8"
notify-debouncer-mini = "0.7"
content_inspector = "0.2"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
