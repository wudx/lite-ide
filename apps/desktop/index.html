<!doctype html>
<html lang="en-US" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>LiteIDE</title>
    <script>
      ;(function () {
        // Keep in sync with THEME_DEFINITIONS / THEME_SNAPSHOT_STORAGE_KEY in
        // packages/workbench/src/services.ts and resolveSystemLocale in
        // packages/workbench/src/i18n.ts.
        var modes = ['dark', 'light', 'solarized-light']
        try {
          var t = localStorage.getItem('lite-ide.theme.v1')
          if (modes.indexOf(t) >= 0) {
            document.documentElement.dataset.theme = t
            document.documentElement.classList.toggle('dark', t === 'dark')
            document.documentElement.classList.toggle('light', t !== 'dark')
          } else {
            // Plugin-contributed themes are restored from their last cached
            // snapshot (id, appearance, variables) before plugins load so the
            // first paint does not flash the default dark theme.
            var applied = false
            if (t) {
              try {
                var rawSnap = localStorage.getItem('lite-ide.theme.snapshot.v1')
                if (rawSnap) {
                  var snap = JSON.parse(rawSnap)
                  if (
                    snap &&
                    snap.id === t &&
                    (snap.appearance === 'dark' || snap.appearance === 'light')
                  ) {
                    document.documentElement.dataset.theme = snap.id
                    document.documentElement.classList.toggle('dark', snap.appearance === 'dark')
                    document.documentElement.classList.toggle('light', snap.appearance !== 'dark')
                    if (snap.variables && typeof snap.variables === 'object') {
                      var vars = snap.variables
                      for (var k in vars) {
                        if (
                          Object.prototype.hasOwnProperty.call(vars, k) &&
                          typeof vars[k] === 'string'
                        ) {
                          document.documentElement.style.setProperty(k, vars[k])
                        }
                      }
                    }
                    applied = true
                  }
                }
              } catch (e) {}
            }
            if (!applied) {
              document.documentElement.dataset.theme = 'dark'
              document.documentElement.classList.add('dark')
              document.documentElement.classList.remove('light')
            }
          }
          var locPref = localStorage.getItem('lite-ide.locale.v1')
          var nav = (
            navigator.language ||
            (navigator.languages && navigator.languages[0]) ||
            ''
          )
            .trim()
            .toLowerCase()
            .replace(/_/g, '-')
          var resolvedLang =
            locPref && locPref !== 'system' && /^[\w-]+$/.test(locPref)
              ? locPref
              : nav === 'zh' || nav.indexOf('zh-') === 0
                ? 'zh-CN'
                : 'en-US'
          document.documentElement.lang = resolvedLang
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.classList.add('dark')
          document.documentElement.lang = 'en-US'
        }
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-app, #12141a);
      }
      html.light,
      html.light body {
        background-color: var(--bg-app, #eaedf2);
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-app, #12141a);
        user-select: none;
        opacity: 1;
        transition: opacity 180ms ease-out;
      }
      html.light #app-splash {
        background-color: var(--bg-app, #eaedf2);
      }
      html[data-theme='solarized-light'],
      html[data-theme='solarized-light'] body,
      html[data-theme='solarized-light'] #app-splash {
        background-color: var(--bg-app, #eee8d5);
      }
      #app-splash.is-ready {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 15px;
        pointer-events: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.52));
      }
      html.light .app-splash-logo {
        filter: drop-shadow(0 10px 24px rgba(15, 23, 42, 0.18))
          drop-shadow(0 2px 6px rgba(15, 23, 42, 0.08));
      }
    </style>
  </head>
  <body>
    <div id="app-splash" data-tauri-drag-region aria-label="Loading LiteIDE">
      <img src="/icon.png" alt="LiteIDE" draggable="false" class="app-splash-logo" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
