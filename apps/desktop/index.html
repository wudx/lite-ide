<!doctype html>
<html lang="en-US" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>LiteIDE</title>
    <script>
      ;(function () {
        // Keep in sync with THEME_DEFINITIONS in packages/workbench/src/services.ts
        // and resolveSystemLocale in packages/workbench/src/i18n.ts.
        // Plugin-contributed theme ids are unknown at this stage: they boot as
        // dark and get their inline variables once ThemeState applies the
        // registered theme after plugin registration.
        var modes = ['dark', 'light', 'solarized-light']
        try {
          var t = localStorage.getItem('lite-ide.theme.v1')
          var mode = modes.indexOf(t) >= 0 ? t : 'dark'
          document.documentElement.dataset.theme = mode
          document.documentElement.classList.toggle('dark', mode === 'dark')
          document.documentElement.classList.toggle('light', mode !== 'dark')
          var locPref = localStorage.getItem('lite-ide.locale.v1')
          var nav = (
            navigator.language ||
            (navigator.languages && navigator.languages[0]) ||
            ''
          )
            .trim()
            .toLowerCase()
            .replace(/_/g, '-')
          var resolvedLang =
            locPref && locPref !== 'system' && /^[\w-]+$/.test(locPref)
              ? locPref
              : nav === 'zh' || nav.indexOf('zh-') === 0
                ? 'zh-CN'
                : 'en-US'
          document.documentElement.lang = resolvedLang
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.classList.add('dark')
          document.documentElement.lang = 'en-US'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
